name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to build"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      custom_tag:
        description: "Custom tag name (optional)"
        required: false
        type: string
      push_latest:
        description: "Also push as latest/beta tag"
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: felipevasquez350/terratech-worlds-docker-server
  REGISTRY: ghcr.io

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare tag variables
        id: prepare_tags
        run: |
          # Determine the tag to use
          if [ ! -z "${{ inputs.custom_tag }}" ]; then
            CUSTOM_TAG="${{ inputs.custom_tag }}"
            echo "Using custom tag: ${CUSTOM_TAG}"
            echo "tag=${CUSTOM_TAG}" >> $GITHUB_OUTPUT
          else
            # Generate a default tag based on current date and time
            DEFAULT_TAG="$(date +'%Y%m%d-%H%M%S')"
            echo "No custom tag provided, using default: ${DEFAULT_TAG}"
            echo "tag=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          fi

          # Prepare the tags string for docker build
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version_type == 'beta' && 'beta-' || '' }}$([ ! -z "${{ inputs.custom_tag }}" ] && echo "${{ inputs.custom_tag }}" || echo "$(date +'%Y%m%d-%H%M%S')")"

          # Add latest or beta tag if requested
          if [ "${{ inputs.push_latest }}" == "true" ]; then
            if [ "${{ inputs.version_type }}" == "beta" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
              echo "Also tagging as beta"
            else
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
              echo "Also tagging as latest"
            fi
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            BETA=${{ inputs.version_type == 'beta' && 'true' || 'false' }}
          tags: ${{ steps.prepare_tags.outputs.tags }}
